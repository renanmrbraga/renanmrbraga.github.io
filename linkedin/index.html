<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://renanmrbraga.vercel.app" />
    <title>Redirecting...</title>
    <style>
      @font-face {
        font-family: "Segoe UI Custom";
        src: local("Segoe UI"), local("Tahoma"), local("Verdana");
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background-color: #0f0f0f;
        color: #f87171;
        font-family: "Segoe UI Custom", sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        transition: opacity 200ms ease-in-out;
      }

      .fade-out {
        opacity: 0;
      }

      .loader {
        width: 48px;
        height: 48px;
        border: 6px solid #333;
        border-top: 6px solid #f87171;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      a {
        color: #f87171;
        text-decoration: none;
      }
    </style>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        // Forward source paths to the configured Vercel routes.
        const path = window.location.pathname.replace(/\/+$/, "");
        const redirectPaths = ["/linkedin", "/curriculo", "/github"];
        const targetPath = redirectPaths.includes(path) ? path : "/";
        const target = new URL(targetPath, "https://renanmrbraga.vercel.app");

        target.search = window.location.search;
        target.hash = window.location.hash;

        const lang = navigator.language || navigator.userLanguage;
        const isPt = lang.toLowerCase().startsWith("pt");

        // Match the document language to the visitor.
        document.documentElement.lang = isPt ? "pt-BR" : "en";
        const msg = isPt
          ? 'Redirecionando para o <a href="https://renanmrbraga.vercel.app/">meu portfólio</a>...'
          : 'Redirecting to <a href="https://renanmrbraga.vercel.app/">my portfolio</a>...';

        document.getElementById("msg").innerHTML = msg;
        document.querySelector("#msg a").href = target.href;

        // Display the animation for 600 ms.
        setTimeout(() => {
          document.body.classList.add("fade-out");

          // Wait another 200 ms to complete the transition.
          setTimeout(() => {
            window.location.replace(target.href);
          }, 200);
        }, 600);
      });
    </script>
  </head>
  <body>
    <div class="loader"></div>
    <p id="msg"></p>
  </body>
</html>
